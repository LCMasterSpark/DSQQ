name: release

# 打 tag 时构建并发布：先把产物打成 zip 再上传，
# 避免直接上传目录导致 Release 里散落一堆文件。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 0.1.0）'
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    # 与 build 工作流同理：WPF + net10.0-windows 只能在 Windows 上构建。
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 便携包要用 Python 组装，并用 pnpm 现装桥接依赖
      # （仓库里不带 node_modules —— 它是 pnpm 的链接结构，复制会膨胀 8 倍）。
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 解析版本号
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            # 去掉 tag 前缀的 v，例如 v0.1.0 → 0.1.0
            $v = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $v = '${{ github.event.inputs.version }}'
          }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: 还原
        run: dotnet restore DSQQ.slnx

      - name: 测试
        run: dotnet test DSQQ.slnx --configuration Release --logger "trx;LogFileName=test-results.trx"

      # framework-dependent：体积小，但目标机需安装 .NET 10 桌面运行时。
      - name: 发布（framework-dependent）
        run: >
          dotnet publish DSQQ/DSQQ.csproj
          --configuration Release
          --no-restore
          --output publish/framework-dependent
          -p:Version=${{ steps.version.outputs.value }}

      # self-contained：体积大，但目标机无需预装运行时。
      - name: 发布（self-contained 单文件）
        run: >
          dotnet publish DSQQ/DSQQ.csproj
          --configuration Release
          --no-restore
          --runtime win-x64
          --self-contained true
          --output publish/self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.value }}

      - name: 打包
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'

          # 使用说明放在仓库里（packaging/使用说明.txt）而不是内嵌在 YAML：
          # 内嵌 here-string 会带 YAML 块标量的缩进，且 Windows PowerShell 的
          # Out-File -Encoding utf8 会写入 BOM，打包后打开是乱码。
          foreach ($dir in 'publish/framework-dependent', 'publish/self-contained') {
            Copy-Item 'packaging/使用说明.txt' $dir -Force
          }

          # 用 .NET 的 ZipFile 而非 Compress-Archive：后者对 170 MB 的单文件包慢得离谱。
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          Compress-Archive -Path publish/framework-dependent/* -DestinationPath "publish/DSQQ-$version-win-x64-framework-dependent.zip" -Force
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path 'publish/self-contained').Path,
            (Join-Path (Resolve-Path 'publish').Path "DSQQ-$version-win-x64-self-contained.zip"),
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false)

          Get-ChildItem publish/*.zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      # 便携包：DSQQ + SnowLuma + qq-bridge，解压即用。
      # 这是给最终用户的形态 —— 他只需要面对这一个仓库。
      #
      # 诊断安排：这一步同时涉及 Python / Node / pnpm / 网络下载四件事，
      # 失败时只看到「Process completed with exit code 1」是没法定位的。
      # 所以把完整输出落盘，并在失败时写进 step summary ——
      # summary 是渲染在 job 页面里的，公开仓库无需令牌即可查看。
      - name: 构建便携包
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'portable-build.log'

          "### 环境" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "``````" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $envDump = @()
          foreach ($tool in 'python', 'node', 'pnpm') {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            $envDump += if ($cmd) { "$tool -> $($cmd.Source)" } else { "$tool -> 不在 PATH 上" }
          }
          $envDump += "cwd -> $(Get-Location)"
          $envDump | Out-File -Append $env:GITHUB_STEP_SUMMARY
          "``````" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $envDump | ForEach-Object { Write-Host $_ }

          # 不因单个探测失败而中断：真正的结论来自下面构建脚本的输出。
          $ErrorActionPreference = 'Continue'
          python --version *>&1 | Tee-Object -FilePath $log -Append
          node --version   *>&1 | Tee-Object -FilePath $log -Append
          pnpm --version   *>&1 | Tee-Object -FilePath $log -Append

          python packaging/build-portable.py --dsqq-from publish/self-contained *>&1 |
            Tee-Object -FilePath $log -Append
          $code = $LASTEXITCODE

          if ($code -ne 0) {
            "### 便携包构建失败（exit $code）" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "``````text" | Out-File -Append $env:GITHUB_STEP_SUMMARY
            Get-Content $log -Tail 80 | Out-File -Append $env:GITHUB_STEP_SUMMARY
            "``````" | Out-File -Append $env:GITHUB_STEP_SUMMARY

            # 临时诊断通道：job logs 接口需要 admin 权限，本地拿不到输出，
            # 而"靠猜"每轮要烧一次完整的 CI 往返。把日志推到一个专门的分支，
            # 之后用普通 git 就能读。定位完成后这一段应当删掉。
            try {
              git config user.email 'ci@diagnostics.local'
              git config user.name 'ci diagnostics'
              git checkout -b ci-diagnostics
              Copy-Item $log 'ci-portable-build.log' -Force
              git add -f ci-portable-build.log
              git commit -m "ci: portable build log (temp diagnostics)"
              git push --force origin ci-diagnostics
              Write-Host '诊断日志已推送到 ci-diagnostics 分支'
            } catch {
              Write-Host "诊断日志推送失败：$_"
            }

            exit $code
          }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: DSQQ-${{ steps.version.outputs.value }}
          path: |
            publish/*.zip
            packaging/dist/*.zip

      - name: 创建 Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/*.zip
            packaging/dist/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
