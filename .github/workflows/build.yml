name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    # 必须是 Windows：项目目标框架是 net10.0-windows 且使用 WPF，
    # Linux/macOS runner 无法构建（会报 NETSDK1100）。
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原依赖
        # 必须显式带 --runtime。
        # DSQQ.csproj 声明了 <RuntimeIdentifier>win-x64</RuntimeIdentifier>（为了让 publish
        # 的输出路径与本地一致），于是构建阶段需要 win-x64 的运行时包。
        # 不带 RID 的还原不会去下这些包，构建就会报：
        #   The runtime pack for Microsoft.WindowsDesktop.App.Runtime.win-x64 was not downloaded.
        # 本地之所以从来碰不到这个问题，是因为本机早就 restore/publish 过 win-x64，
        # 包已经在 NuGet 缓存里了 —— 又一个"只在 CI 上才现形"的坑。
        run: dotnet restore DSQQ.slnx --runtime win-x64

      - name: 构建
        run: dotnet build DSQQ.slnx --configuration Release --no-restore

      - name: 单元测试
        run: dotnet test DSQQ.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore
